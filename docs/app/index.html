<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" dir="ltr">

<head>
  <link rel="icon" type="image/x-icon" href="static/favicon.ico?v=5340cd23">
  <link rel="stylesheet" href="static/demo_open.css?v=3f61e3ef">
  <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
  <!-- "auto": use server.py when it is running, else the browser. The GitHub Pages copy (docs/app) says "browser". -->
  <meta name="devselftrace-mode" content="browser" />
  <meta name="description" content="DevSelfTrace: retrospective self-annotation of programming behavior" />
  <meta name="keywords" content="" />
  <meta name="author" content="" />
  <title>DevSelfTrace</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; color: #222; }
    .hidden { display: none !important; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Two columns: questions/logs on the left, video and controls on the right.
       Fixed proportions, so the left column no longer shrinks when a label set has few questions. */
    .layout { display: flex; gap: 20px; align-items: flex-start; }
    .col-left { flex: 0 0 40%; min-width: 340px; }
    .col-right { flex: 1 1 0; min-width: 0; }

    /* Questions / Logs Table tabs */
    .view-toggle { display: flex; gap: 12px; margin-bottom: 12px; }
    .toggle-btn { flex: 1 1 0; padding: 9px 10px; font-size: 16px; font-weight: bold; border: 2px solid #333; border-radius: 6px; cursor: pointer; }
    .toggle-btn.active { background-color: #bf1f24; border-color: #bf1f24; color: white; }
    .toggle-btn.inactive { background-color: #e6e6e6; color: #222; }

    /* Scrolling panel holding the questions or the logs table */
    .logs-table { height: 62vh; overflow-y: auto; overflow-x: hidden; border: 1px solid #ccc; border-radius: 6px; }
    .content-section { padding: 12px 14px; }
    #table_events th, #table_events td { padding: 4px 6px; border-bottom: 1px solid #eee; vertical-align: top; }
    #table_events th { font-weight: bold; color: #555; }
    .highlighted-row { background-color: #d1e7dd; }

    /* Questions built from the label set (renderQuestions in static/app.js) */
    .dimension { padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid #ead9e1; }
    .dimension:last-child { border-bottom: none; margin-bottom: 0; }
    .dimension-title { margin: 0 0 2px; color: #7A2048; font-size: 17px; font-weight: bold; }
    .dimension-prompt { margin: 0 0 8px; color: #333; font-size: 14px; }
    .dimension-help { margin: -4px 0 8px; color: #666; font-size: 13px; }
    .dimension-select, .other-input { width: 100%; padding: 7px 8px; border: 1px solid #bbb; border-radius: 5px; background: #fff; font: inherit; font-size: 14px; }
    .other-input { margin-top: 6px; }
    .option-hint { margin-top: 4px; color: #555; font-size: 13px; }
    .pair-row { display: flex; gap: 8px; align-items: flex-end; }
    .pair-field { flex: 1 1 0; min-width: 0; }
    .field-label { margin-bottom: 3px; color: #555; font-size: 12px; }
    .pair-field .dimension-select { padding: 6px 4px; font-size: 13px; }
    .pair-add { flex: 0 0 auto; padding: 7px 12px; border: none; border-radius: 5px; background: #356a96; color: #fff; font-weight: 600; cursor: pointer; }
    .pair-add:hover { background: #1e2761; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 4px 3px 10px; border-radius: 14px; background: #f1e6ec; color: #5a1836; font-size: 13px; }
    .chip button { padding: 0 5px; border: none; background: transparent; color: #7A2048; font-size: 15px; line-height: 1; cursor: pointer; }
    .chips-empty { color: #888; font-size: 13px; }

    /* Add / Delete / Edit and the summary of the interval being annotated */
    .button-group { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; }
    #state { margin-top: 10px; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
    #state .missing { margin-top: 4px; color: #8a4b00; }

    /* The video fills the right column; 16:9 until a recording is loaded, then the recording's own shape,
       never taller than 70% of the window (letterboxed instead of cropped) */
    #codeVideo { display: block; width: 100%; height: auto; max-height: 70vh; aspect-ratio: auto 16 / 9; margin-top: 10px; background: #000; object-fit: contain; }

    /* Start / end times: typed, or taken from the video */
    #timeSelection { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 10px; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; background-color: #f9f9f9; }
    .time-group { display: inline-flex; align-items: center; gap: 6px; }
    .time-input { width: 84px; padding: 5px 7px; border: 1px solid #bbb; border-radius: 5px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; }
    .time-input.invalid { border-color: #c0392b; background: #fdecea; }
    .link-btn { padding: 4px 8px; border: 1px solid #bbb; border-radius: 5px; background: #fff; font-size: 13px; cursor: pointer; }

    .navigation-buttons { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .labelset-bar, .session-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 15px; }
    .labelset-bar select { padding: 4px; }
    .labelset-lock { color: #555; font-size: 13px; }
    .video-hint { margin-top: 6px; color: #555; font-size: 13px; }

    /* Save status (top right) and save problems banner */
    .save-status { position: fixed; top: 8px; right: 12px; z-index: 1000; padding: 4px 10px; border-radius: 12px; font-size: 12px; line-height: 1.4; background: #e8e8e8; color: #333; }
    .save-status.ok { background: #d1e7dd; color: #0f5132; }
    .save-status.error { background: #f8d7da; color: #842029; }
    .save-status.readonly { background: #cfe2ff; color: #084298; }
    /* In the page flow (not floating), so it never covers the controls */
    .save-banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 36px 1em 8px; padding: 10px 14px; border: 1px solid #ffecb5; border-radius: 6px; background: #fff3cd; color: #664d03; font-size: 14px; line-height: 1.4; }
    .save-banner button { padding: 4px 10px; border: 1px solid #997404; border-radius: 4px; background: #fff; color: #664d03; cursor: pointer; }

    /* Explanation that appears right away on hover or keyboard focus (data-tip="..."); the browser's own
       title tooltip only shows after a delay */
    .tip { position: relative; }
    .tip::after {
      content: attr(data-tip);
      /* opens to the left of the button's right edge: these buttons sit in the right-hand column */
      position: absolute; right: 0; bottom: calc(100% + 8px); z-index: 1200;
      width: 300px; padding: 8px 10px; border-radius: 6px; background: #333; color: #fff;
      font-size: 12px; font-weight: normal; line-height: 1.4; text-align: left; white-space: normal;
      opacity: 0; pointer-events: none; transition: opacity 0.15s;
    }
    .tip:hover::after, .tip:focus-visible::after { opacity: 1; }
    .tip:disabled::after { content: none; }

    /* Short messages that disappear by themselves (instead of pop-up alerts) */
    #toasts { position: fixed; left: 50%; bottom: 20px; z-index: 1100; display: flex; flex-direction: column; align-items: center; gap: 8px; transform: translateX(-50%); pointer-events: none; }
    .toast { max-width: 560px; padding: 9px 14px; border-radius: 6px; background: #333; color: #fff; font-size: 14px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25); transition: opacity 0.3s; }
    .toast.error { background: #a12a2a; }
    .toast.fade { opacity: 0; }
  </style>
</head>

<body>
  <div id="save-status" class="save-status" role="status" aria-live="polite">Loading…</div>
  <div id="save-banner" class="save-banner hidden" role="alert"></div>
  <div id="toasts" aria-live="polite"></div>

  <div class="main">
    <div class="section">
      <div class="section-content">
        <div class="post-body" style="height: 100vh; padding-left: 1em; padding-right: 1em;">
          <div class="row layout">
            <div class="column col-left">

              <div class="view-toggle">
                <button id="questionsToggle" class="toggle-btn active">Questions</button>
                <button id="logTablesToggle" class="toggle-btn inactive">Logs Table</button>
              </div>

              <!-- Logs Table -->
              <div id="bodydesc" class="logs-table content-section hidden">
                <h3>Logs Table</h3>
                <!-- Header and rows are built by populateLogsTable in static/app.js -->
                <table id="table_events" style="width: 100%; font: normal 60% sans-serif; border-collapse: collapse;"></table>
              </div>

              <!-- Questions: one block per dimension of the active label set, built by static/app.js -->
              <div id="questionsView" class="logs-table content-section"></div>

              <!-- Buttons positioned outside the scroll -->
              <div class="button-group">
                <button id="addRow" class="btn-hover color-8" title="Add the interval with these answers">Add Log</button>
                <button id="deleteRow" class="btn-hover color-8" title="Delete the selected row">Delete Log</button>
                <button id="editLabel" class="btn-hover color-8" title="Change the answers of the selected row (only the questions you answer change)">Edit Label</button>
              </div>

              <!-- The interval being annotated: its times, answers, and what is still needed -->
              <div id="state" aria-live="polite"></div>
            </div>

            <div class="column col-right">
              <!-- Video Playback Section -->
              <div class="wrapper">
                <video id="codeVideo" controls muted></video>
              </div>

              <!-- Time Controls -->
              <div id="timeSelection">
                <span class="time-group">
                  <label for="startTimeInput">Start</label>
                  <input id="startTimeInput" class="time-input" type="text" inputmode="decimal" placeholder="m:ss.s" autocomplete="off">
                  <button id="setStartTime" class="btn-hover color-10" title="Use the video's current time as the start">Set from video</button>
                </span>
                <span class="time-group">
                  <label for="endTimeInput">End</label>
                  <input id="endTimeInput" class="time-input" type="text" inputmode="decimal" placeholder="m:ss.s" autocomplete="off">
                  <button id="setEndTime" class="btn-hover color-10" title="Use the video's current time as the end">Set from video</button>
                </span>
                <button id="jumpToStart" class="link-btn" title="Move the video to the start time">Jump to start</button>
              </div>

              <!-- Playback Controls -->
              <div class="navigation-buttons" style="margin-top: 15px;">
                <button class="button" style="border-radius: 50%;" id="autoPlay">AutoPlay</button>
                <label for="speed_slider">Playback Speed</label>
                <input type="range" list="steplist" style="width: 15%;" min="0.25" step="0.25" max="3" value="1"
                  class="slider" id="speed_slider">
                <span id="speed_value">1×</span>
                <datalist id="steplist">
                  <option>0.25</option>
                  <option>0.5</option>
                  <option>1</option>
                  <option>1.5</option>
                  <option>2</option>
                  <option>2.5</option>
                  <option>3</option>
                </datalist>
                Navigate Events
                <button class="button" id="prev_index">&#8249;</button>
                <button class="button" id="next_index">&#8250;</button>
                <button class="button" id="replay_event">Replay Event</button>
              </div>

              <!-- Section for video selection -->
              <div style="margin-top: 15px;">
                <label for="video-upload">Select a video:</label>
                <input type="file" id="video-upload" accept="video/*">
                <button id="loadVideoButton" class="btn-hover color-10">Load Video</button>
                <p class="video-hint">Load any screen recording (.mp4 or .webm) from your computer. It plays only in your browser and is never uploaded. You can also type start and end times without a video. No recording at hand? Click "Load sample" below.</p>
              </div>

              <!-- Label set: which dimensions and options the questions show -->
              <div class="labelset-bar">
                <label for="labelset-select">Label set:</label>
                <select id="labelset-select"></select>
                <button id="labelset-load" class="btn-hover color-10" title="Load a label set from a JSON file">Load from file…</button>
                <input type="file" id="labelset-file" accept=".json,application/json" hidden>
                <span id="labelset-lock" class="labelset-lock hidden"></span>
              </div>

              <!-- Session: take the annotations out, bring them back, or start over -->
              <div class="session-bar">
                <span>Session:</span>
                <button id="export-json" class="btn-hover color-10" title="Download the annotations as JSON (can be imported again)">Export JSON</button>
                <button id="export-csv" class="btn-hover color-10" title="Download the annotations as a CSV table (one row per interval)">Export CSV</button>
                <button id="import-json" class="btn-hover color-10" title="Continue from an exported or older DevSelfTrace JSON file">Import JSON…</button>
                <input type="file" id="import-file" accept=".json,application/json" hidden>
                <button id="start-over" class="btn-hover color-10 tip" data-tip="Clear all annotations and begin again with an empty session, e.g. for the next participant or to switch label sets. You are asked first and can export a copy; on the server the previous version also stays in the .bak backups.">Start over…</button>
                <button id="load-sample" class="btn-hover color-10" title="Load a made-up example session to see how annotations look (not data from any participant)">Load sample</button>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="static/presets.js?v=02943dbd"></script>
  <script src="static/sample.js?v=7eb0ae89"></script>
  <script src="static/core.js?v=5f341f81"></script>
  <script src="static/storage.js?v=8e66accf"></script>
  <script src="static/app.js?v=d9178317"></script>

  <script>
    // JavaScript for toggling views
    const questionsToggle = document.getElementById("questionsToggle");
    const logTablesToggle = document.getElementById("logTablesToggle");
    const questionsView = document.getElementById("questionsView");
    const bodydesc = document.getElementById("bodydesc");

    questionsToggle.addEventListener("click", () => {
      questionsView.classList.remove("hidden");
      bodydesc.classList.add("hidden");
      questionsToggle.classList.add("active");
      questionsToggle.classList.remove("inactive");
      logTablesToggle.classList.remove("active");
      logTablesToggle.classList.add("inactive");
    });

    logTablesToggle.addEventListener("click", () => {
      questionsView.classList.add("hidden");
      bodydesc.classList.remove("hidden");
      logTablesToggle.classList.add("active");
      logTablesToggle.classList.remove("inactive");
      questionsToggle.classList.remove("active");
      questionsToggle.classList.add("inactive");
    });
  </script>
  
</body>

</html>
